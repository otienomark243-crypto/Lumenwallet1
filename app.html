<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lumen Wallet</title>
  <meta name="theme-color" content="#031315">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #031315;
      color: #e2f2f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .app-container {
      width: 100%;
      max-width: 420px;
      background: #081d20;
      border-radius: 28px;
      border: 1px solid #123b3e;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 20px;
      color: #00e5ff;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ff88;
    }
    .balance-card {
      background: linear-gradient(135deg, #0e2a2e 0%, #05181a 100%);
      border: 1px solid #1a4d52;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
    }
    .balance-label {
      font-size: 14px;
      color: #8ab3b0;
      margin-bottom: 8px;
    }
    .balance-amount {
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .balance-change {
      font-size: 13px;
      color: #00ff88;
      font-weight: 600;
    }
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .btn-action {
      background: #0d2f33;
      border: 1px solid #18484d;
      color: #e2f2f0;
      border-radius: 16px;
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-action:active {
      transform: scale(0.95);
      background: #00e5ff;
      color: #031315;
    }
    .btn-action svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #8ab3b0;
      margin-bottom: 16px;
    }
    .asset-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .asset-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b2427;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #123b3e;
    }
    .asset-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .asset-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #143e42;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      color: #00e5ff;
    }
    .asset-name {
      font-weight: 600;
      font-size: 15px;
    }
    .asset-sub {
      font-size: 12px;
      color: #8ab3b0;
    }
    .asset-val {
      text-align: right;
    }
    .asset-amount {
      font-weight: 600;
      font-size: 15px;
    }
    .asset-fiat {
      font-size: 12px;
      color: #8ab3b0;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="logo-badge">
        <div class="status-dot"></div>
        Lumen Wallet
      </div>
      <div class="asset-sub">Web3 Non-Custodial</div>
    </div>

    <div class="balance-card">
      <div class="balance-label">Total Net Worth</div>
      <div class="balance-amount">$2,480.50</div>
      <div class="balance-change">+4.25% today</div>
    </div>

    <div class="action-grid">
      <button class="btn-action" onclick="alert('Send feature ready')">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Send
      </button>
      <button class="btn-action" onclick="alert('Receive address: 0x71C...89A')">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Receive
      </button>
      <button class="btn-action" onclick="alert('Swap aggregator connected')">
        <svg viewBox="0 0 24 24"><path d="M7 10l5-5 5 5M17 14l-5 5-5-5"/></svg>
        Swap
      </button>
      <button class="btn-action" onclick="alert('Fiat gateway active')">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Buy
      </button>
    </div>

    <div class="section-title">Assets</div>

    <div class="asset-list">
      <div class="asset-item">
        <div class="asset-info">
          <div class="asset-icon">ETH</div>
          <div>
            <div class="asset-name">Ethereum</div>
            <div class="asset-sub">$3,240.10</div>
          </div>
        </div>
        <div class="asset-val">
          <div class="asset-amount">0.55 ETH</div>
          <div class="asset-fiat">$1,782.05</div>
        </div>
      </div>

      <div class="asset-item">
        <div class="asset-info">
          <div class="asset-icon" style="color: #00ff88;">USDT</div>
          <div>
            <div class="asset-name">Tether USD</div>
            <div class="asset-sub">$1.00</div>
          </div>
        </div>
        <div class="asset-val">
          <div class="asset-amount">698.45 USDT</div>
          <div class="asset-fiat">$698.45</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
